[project]
name = "cleaning-platform"
version = "0.1.0"
description = "Sample project using code generated by DDD Presenter"
requires-python = ">=3.11"
# PyJWT (with cryptography for RS256 / ES256) is used by the generated bearer JWT authenticator.
dependencies = ["pydantic>=2.6,<3", "pyjwt[crypto]>=2.8"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["cleaning_platform"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "PT", "RUF"]
# Model text (descriptions, messages) is often Japanese: full-width punctuation is intended.
ignore = ["RUF001", "RUF002", "RUF003"]
