[project]
name = "cleaning-platform"
version = "0.1.0"
description = "Sample project using code generated by DDD Presenter"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["cleaning_platform"]
